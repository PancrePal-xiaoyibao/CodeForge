name: skills-lint

# 元数据门禁：防止「缺 frontmatter / BOM / CRLF / 三镜像缺 skill」的改动进入 main。
# 触发背景：社区反馈装 CodeForge 后 Codex 拒载 ai-spec/SKILL.md（缺必需 YAML frontmatter），
# 根因正是仓库长期没有元数据校验。本 workflow 即为此设的回归护栏。

on:
  push:
    branches: [main]
    paths:
      - ".codex/skills/**"
      - ".gemini/skills/**"
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".claude/agents/**"
      - "scripts/validate-skills.py"
      - ".github/workflows/skills-lint.yml"
  pull_request:
    paths:
      - ".codex/skills/**"
      - ".gemini/skills/**"
      - ".claude/skills/**"
      - ".claude/commands/**"
      - ".claude/agents/**"
      - "scripts/validate-skills.py"
      - ".github/workflows/skills-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 校验 skill 元数据与格式
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Validate skills (metadata / frontmatter / encoding / line endings / mirrors)
        run: python3 scripts/validate-skills.py

      - name: Summary
        if: always()
        run: |
          {
            echo "### Skill 元数据门禁"
            echo ""
            echo "校验项：frontmatter 必需字段 · name/description 规范 · BOM · 行尾 · 三镜像 skill 集合 · Claude command description"
            echo ""
            echo "本地同款命令：\`python3 scripts/validate-skills.py\`"
          } >> "$GITHUB_STEP_SUMMARY"
